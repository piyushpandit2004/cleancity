<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard | CleanCity</title>

    <link rel="stylesheet" href="./css/worker-dashboard.css">
    <script src="./worker-dashboard.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="#" class="brand">🌿 CleanCity</a>
    <div class="nav-right">
        <span id="workerEmail">Worker</span>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</header>

<main class="container">

    <section class="welcome-section">
        <h1>Welcome, Worker! 👋</h1>
        <p>Manage your complaints and help keep your city clean.</p>
    </section>

    <section class="stats-grid">
        <div class="stat-card">
            <p>Available Complaints</p>
            <h2 id="availableCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Assigned to You</p>
            <h2 id="assignedCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Work In Progress</p>
            <h2 id="progressCount">0</h2>
        </div>
    </section>

    <div id="errorMessage" class="message error-message" role="alert" hidden></div>
    <div id="successMessage" class="message success-message" role="status" hidden></div>

    <!-- Available complaints -->
    <section class="complaints-section">
        <div class="section-heading">
            <h2>📋 Available Complaints</h2>
            <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
        </div>

        <input
                type="search"
                id="availableSearch"
                class="search-input"
                placeholder="🔍 Search by ID, title or location..."
                aria-label="Search available complaints"
        >

        <div id="availableComplaints" class="complaints-list">
            <div class="loading">Loading complaints...</div>
        </div>
    </section>

    <!-- Assigned complaints -->
    <section class="complaints-section">
        <div class="section-heading">
            <h2>🛠️ My Assigned Complaints</h2>
        </div>

        <input
                type="search"
                id="assignedSearch"
                class="search-input"
                placeholder="🔍 Search your complaints by ID, title or location..."
                aria-label="Search assigned complaints"
        >

        <div id="assignedComplaints" class="complaints-list">
            <div class="loading">Loading your complaints...</div>
        </div>
    </section>

</main>

<!-- Complaint details modal -->
<div id="complaintModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button id="closeModalBtn" class="modal-close" aria-label="Close">×</button>
        <h2>Complaint Details</h2>
        <div id="modalDetails"></div>
    </div>
</div>

</body>
</html>
